name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '00 15 * * *'

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    # self-hosted runner 上 easimon/maximize-build-space 无效，改为直接清理容器残留
    # 如果 runner 机器根分区仍然紧张，可将 Docker 数据目录迁移到大容量磁盘
    - name: Cleanup leftover container data
      run: |
        echo "任务开始前磁盘占用"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="
        docker system prune -f
        docker builder prune -af

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image Aliyun
      run: |
        docker login -u $ALIYUN_REGISTRY_USER -p $ALIYUN_REGISTRY_PASSWORD $ALIYUN_REGISTRY
        # 数据预处理,判断镜像是否重名
        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')
            # 将@sha256:等字符删除
            image="${image%%@*}"
            # 获取镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            # 获取命名空间 例如kasmweb,  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            # 这里不要是空值影响判断
            name_space="${name_space}_"
            # 获取镜像名例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            
            # 如果镜像存在于数组中，则添加temp_map
            if [[ -n "${temp_map[$image_name]}" ]]; then
                 # 如果temp_map已经存在镜像名，判断是不是同一命名空间
                 if [[ "${temp_map[$image_name]}" != $name_space  ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                # 存镜像的命名空间
                temp_map[$image_name]=$name_space
            fi       
        done < images.txt
        
        
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
        
            platform=$(echo "$line" | awk -F'--platform[ =]' '{if (NF>1) print $2}' | awk '{print $1}')
            echo "platform is $platform"
            # 如果存在架构信息 将架构信息拼到镜像名称前面
            if [ -z "$platform" ]; then
                platform_prefix=""
            else
                platform_prefix="${platform//\//_}_"
            fi
            echo "platform_prefix is $platform_prefix"
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')

            # 获取 镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            # 获取命名空间 例如kasmweb  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            # 获取镜像名例  例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
        
            name_space_prefix=""
            # 如果镜像名重名
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
               #如果命名空间非空，将命名空间加到前缀
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi
            
            # 将@sha256:等字符删除
            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"
            # 从源镜像 manifest list 中提取真实平台的 digest，剔除 attestation / unknown / empty manifest
            # 避免 Aliyun ACR 403: unknown manifest class for application/vnd.oci.empty.v1+json
            repo="${image%:*}"
            raw_manifest=$(docker buildx imagetools inspect --raw "$image" 2>/dev/null || true)
            if [ -n "$platform" ]; then
                # 用户显式指定了平台，只取匹配的 digest
                selected_digests=$(echo "$raw_manifest" | jq -r --arg p "$platform" '
                    if type=="object" and has("manifests") then
                        .manifests[]?
                        | select(.platform != null)
                        | select(.platform.attestation != true)
                        | select(.platform.os != "unknown")
                        | "\(.platform.os)/\(.platform.architecture)" as $base
                        | (if .platform.variant then $base + "/" + .platform.variant else $base end) as $full
                        | select($base == $p or $full == $p)
                        | .digest
                    else empty end')
            else
                # 未指定平台，取所有真实镜像平台（排除 attestation / unknown）
                selected_digests=$(echo "$raw_manifest" | jq -r '
                    if type=="object" and has("manifests") then
                        .manifests[]?
                        | select(.platform != null)
                        | select(.platform.attestation != true)
                        | select(.platform.os != "unknown")
                        | .digest
                    else empty end')
            fi
            if [ -n "$selected_digests" ]; then
                src_args=""
                while read -r d; do
                    [ -z "$d" ] && continue
                    src_args="$src_args ${repo}@${d}"
                done <<< "$selected_digests"
                echo "docker buildx imagetools create -t $new_image$src_args"
                if ! docker buildx imagetools create -t "$new_image" $src_args; then
                    echo "镜像推送失败，跳过: $image"
                    continue
                fi
            else
                # 单平台镜像（无 manifest list），直接拷贝
                echo "docker buildx imagetools create -t $new_image $image"
                if ! docker buildx imagetools create -t "$new_image" "$image"; then
                    echo "镜像推送失败，跳过: $image"
                    continue
                fi
            fi

        done < images.txt
